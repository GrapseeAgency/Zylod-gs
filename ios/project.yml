name: Zylod
options:
  bundleIdPrefix: com.zylod
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.4.5"
    CURRENT_PROJECT_VERSION: "245"
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Debug:
      PRODUCT_BUNDLE_IDENTIFIER: com.zylod.wholesale.debug
    Release:
      PRODUCT_BUNDLE_IDENTIFIER: com.zylod.wholesale
targets:
  Zylod:
    type: application
    platform: iOS
    sources:
      - Zylod
    info:
      path: Zylod/Info.plist
      properties:
        CFBundleDisplayName: Zylod
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # §7.2 — zylod:// deep links (DeepLinkParser port lives in Zylod/Nav/DeepLink.swift).
        CFBundleURLTypes:
          - CFBundleURLName: com.zylod.wholesale
            CFBundleURLSchemes:
              - zylod
        # §7.3 — permission strings required by the bridge (camera barcode
        # scanner, voice recognition, FaceID biometric prompt).
        NSCameraUsageDescription: "Zylod uses the camera to scan product and supplier barcodes/QR codes."
        NSMicrophoneUsageDescription: "Zylod uses the microphone for voice product search."
        NSSpeechRecognitionUsageDescription: "Zylod uses speech recognition to turn your spoken search into text."
        NSFaceIDUsageDescription: "Zylod uses Face ID to confirm sensitive actions like signing in."
        NSAppTransportSecurity:
          # Debug server candidates include local http:// hosts (LAN, emulator
          # loopback). Release candidates are HTTPS-only; remove before any
          # App Store submission.
          NSAllowsLocalNetworking: true
schemes:
  Zylod:
    build:
      targets:
        Zylod: all
    run:
      config: Debug
