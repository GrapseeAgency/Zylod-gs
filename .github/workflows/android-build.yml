name: android-build

# Continuous installable build — every commit to main must produce a
# downloadable debug APK for the audit loop (see android/ARCHITECTURE.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      # t290 HARDENING: cache the wrapper distribution — the gradle CDN
      # (services.gradle.org) timed out twice during the same network window
      # that 504'd GitHub's bun assets (android-screenshots 189 attempts 1-2).
      # One good window seeds this cache; every later run restores the dist
      # and never re-downloads it.
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          # Embed the short commit SHA into versionName so an installed APK
          # can be traced to its exact commit on-device.
          ./gradlew :app:assembleDebug "-PcommitSuffix=${GITHUB_SHA::7}" --stacktrace

      # t229h: the RELEASE APK is the package users actually update in place
      # (com.zylod.wholesale — the debug variant installs as a SEPARATE .debug
      # app and can never upgrade an existing install). Debug-key signing is
      # used until a release keystore is added; same key as every previously
      # published zylod-b2b-*.apk, so in-place updates keep working.
      - name: Build release APK (update package)
        run: |
          cd android
          ./gradlew :app:assembleRelease "-PcommitSuffix=${GITHUB_SHA::7}" --stacktrace

      - name: Lint (non-blocking — report surfaces as artifact)
        run: |
          cd android
          ./gradlew :app:lintDebug --stacktrace || echo "::warning::Lint reported issues — see lint artifact"

      - name: Collect lint report (on any result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build info
        run: |
          {
            echo "app:            Zylod (com.zylod.wholesale — release / .debug — debug)"
            echo "commit:         $GITHUB_SHA"
            echo "built from:     https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "workflow run:   ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > build-info.txt
          cat android/app/build/outputs/apk/debug/output-metadata.json >> build-info.txt
          echo '--- release metadata ---' >> build-info.txt
          cat android/app/build/outputs/apk/release/output-metadata.json >> build-info.txt || true
          cat build-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zylod-debug-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zylod-release-apk-${{ github.sha }}
          # t282: the Room schema export (app/schemas/…AppDatabase/<v>.json,
          # exportSchema = true) rides the release artifact so it can be
          # captured and committed from the green build.
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/schemas/
          if-no-files-found: error
          retention-days: 30
